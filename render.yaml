# Render Infrastructure Blueprint for SUV Photography Production Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: suv-photography-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: WEB_CONCURRENCY
        value: 2
      - key: HOST_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateCryptoRandomString: 32
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: DEFAULT_DRIVE_FOLDER_ID
        value: 1hX6TEFSM5ZqlXapIA25dKAEq9jCDd5LO
