version: '3.8'

services:
  # Load Balancer & Reverse Proxy (handles caching & SSL & 1000+ RPS)
  load_balancer:
    image: nginx:alpine
    container_name: event_photos_lb
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app_1
      - app_2
      - app_3
      - app_4
    networks:
      - app_net

  # Replicated Backend Worker 1
  app_1:
    build: .
    container_name: event_photos_app_1
    restart: always
    environment:
      - SERVER_PORT=8000
      - MATCH_THRESHOLD=0.363
      - HOST_PASSWORD=admin123
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - app_net

  # Replicated Backend Worker 2
  app_2:
    build: .
    container_name: event_photos_app_2
    restart: always
    environment:
      - SERVER_PORT=8000
      - MATCH_THRESHOLD=0.363
      - HOST_PASSWORD=admin123
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - app_net

  # Replicated Backend Worker 3
  app_3:
    build: .
    container_name: event_photos_app_3
    restart: always
    environment:
      - SERVER_PORT=8000
      - MATCH_THRESHOLD=0.363
      - HOST_PASSWORD=admin123
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - app_net

  # Replicated Backend Worker 4
  app_4:
    build: .
    container_name: event_photos_app_4
    restart: always
    environment:
      - SERVER_PORT=8000
      - MATCH_THRESHOLD=0.363
      - HOST_PASSWORD=admin123
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  nginx_cache:
