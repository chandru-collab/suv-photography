user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Tuning for 1000+ RPS
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer optimizations
    client_body_buffer_size 16M;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # High-performance disk cache for photos and thumbnails
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=event_photo_cache:100m max_size=10g inactive=60d use_temp_path=off;

    # Rate Limiting Zones (Token Bucket)
    # Search limit: 10 requests per second per IP (burst 25) to protect ONNX CPU inference
    limit_req_zone $binary_remote_addr zone=search_zone:20m rate=10r/s;
    # General API limit: 100 requests per second per IP (burst 200)
    limit_req_zone $binary_remote_addr zone=api_zone:20m rate=100r/s;

    # Upstream Backend Workers Load Balancer
    upstream backend_cluster {
        least_conn; # Distribute load to worker with fewest active connections
        server app_1:8000 max_fails=3 fail_timeout=10s;
        server app_2:8000 max_fails=3 fail_timeout=10s;
        server app_3:8000 max_fails=3 fail_timeout=10s;
        server app_4:8000 max_fails=3 fail_timeout=10s;
        keepalive 64; # Connection pooling to backend
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # 1. Health Checks (High frequency, zero rate limiting)
        location /healthz {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location /readyz {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location /metrics {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Allow prometheus scraper
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
        }

        # 2. Static Assets (CSS, JS, Fonts)
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # 3. Static Photo & Thumbnail Caching Layer
        location ~* ^/api/(photos|thumbnails)/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Nginx Edge Microcaching: serves up to 100,000+ RPS directly from disk cache
            proxy_cache event_photo_cache;
            proxy_cache_key "$scheme$request_method$request_uri";
            proxy_cache_valid 200 304 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # 4. CPU-Heavy Face Search & Detection (Strict Rate Limiting)
        location ~* ^/api/guest/(search|detect-faces) {
            limit_req zone=search_zone burst=25 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # 5. General Application Traffic
        location / {
            limit_req zone=api_zone burst=100 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
